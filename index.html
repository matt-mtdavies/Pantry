<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pantry" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Pantry</title>
    <script>
      // Diagnostic: surface any resource-load or JS errors visibly on-screen.
      window.__diag = function(msg) {
        var el = document.createElement('div');
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#C4220A;color:#fff;padding:12px 16px;font:14px/1.5 system-ui;word-break:break-all';
        el.textContent = msg;
        document.body ? document.body.appendChild(el) : document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(el); });
      };
      window.addEventListener('error', function(e) {
        var src = (e.target && (e.target.src || e.target.href)) || '';
        if (src) window.__diag('Failed to load: ' + src);
      }, { capture: true });
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          window.__diag('App did not load — tap to retry');
          root.style.cssText = 'display:flex;align-items:center;justify-content:center;min-height:100vh';
          var btn = document.createElement('a');
          btn.href = '/'; btn.textContent = 'Tap to retry';
          btn.style.cssText = 'color:#C4633E;font:600 1.1rem system-ui;text-decoration:none';
          root.appendChild(btn);
        }
      }, 5000);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Inline: unregister any service worker before the bundle loads.
         This runs even when the JS bundle 404s due to a stale SW cache,
         then forces a reload so the browser fetches fresh assets. -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (regs.length === 0) return;
          Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
            window.location.reload();
          });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
